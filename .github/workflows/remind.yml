name: VPS到期提醒
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 发送Telegram提醒
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.CHAT_ID }} -d text="⚠️ 提醒：你的VPS VPS-TDCEKW 还有1天到期！快去 https://openworld.eu.org/dashboard 关掉VPN续期，否则就丢了！"
